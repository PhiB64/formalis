

services:
  node-app:
    build:
      context: ./node-app
      dockerfile: Dockerfile
    container_name: node-app
    environment:
      - NODE_ENV
      - PORT
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - formalis-net

      volumes:
        - ./node-app/logs:/usr/src/app/logs

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - formalis-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - node-app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./node-app/public:/usr/share/nginx/html:ro
      # Montage du dossier de certificats SSL de l'hôte
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - formalis-net

volumes:
  mysql-data:

networks:
  formalis-net:
    driver: bridge
