

services:
  node-app:
    build:
      context: ./node-app
      dockerfile: Dockerfile
    container_name: node-app
    environment:
      - NODE_ENV
      - PORT
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - formalis-net

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - formalis-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - node-app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - formalis-net

volumes:
  mysql-data:

networks:
  formalis-net:
    driver: bridge
